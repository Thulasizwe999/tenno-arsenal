n":"Duviri","rarity":"Legendary","maxRank":5,"source":"Duviri"},{"name":"Secondary Surge","collection":"None, Mission","rarity":"Rare","maxRank":5,"source":"Brutus Sisters, Ordis"},{"name":"Shotgun Vendetta","collection":"Duviri","rarity":"Rare","maxRank":5,"source":"Duviri"},{"name":"Theorem Contagion","collection":"Necralisk","rarity":"Rare","maxRank":5,"source":"Iso Vault Bounties All Rot"},{"name":"Theorem Demulcent","collection":"Necralisk","rarity":"Rare","maxRank":5,"source":"Iso Vault Bounties Rot C"},{"name":"Theorem Infection","collection":"Necralisk","rarity":"Rare","maxRank":5,"source":"Iso Vault Bounties Rot C"},{"name":"Virtuos Forge","collection":"Solaris","rarity":"Uncommon","maxRank":3,"source":"Little Duck"},{"name":"Virtuos Fury","collection":"Ostron","rarity":"Uncommon","maxRank":3,"source":"Onkko"},{"name":"Virtuos Ghost","collection":"Ostron","rarity":"Rare","maxRank":3,"source":"Onkko"},{"name":"Virtuos Null","collection":"Ostron","rarity":"Common","maxRank":3,"source":"Onkko"},{"name":"Virtuos Shadow","collection":"Ostron","rarity":"Rare","maxRank":3,"source":"Onkko"},{"name":"Virtuos Spike","collection":"Solaris","rarity":"Common","maxRank":3,"source":"Little Duck"},{"name":"Virtuos Strike","collection":"Ostron","rarity":"Uncommon","maxRank":3,"source":"Onkko"},{"name":"Virtuos Surge","collection":"Solaris","rarity":"Common","maxRank":3,"source":"Little Duck, Cpt. Vor (Steel Path)"},{"name":"Virtuos Tempo","collection":"Ostron","rarity":"Common","maxRank":3,"source":"Onkko"},{"name":"Virtuos Trojan","collection":"Solaris","rarity":"Uncommon","maxRank":3,"source":"Little Duck"}]}</script>
<script>
/* Tenno Arsenal: public application logic. Personal player records are NEVER included in this source. */
'use strict';
const PROFILE_KEY='tenno-arsenal-profile-v1',CAT_KEY='tenno-arsenal-catalogue-v1',CHECK_KEY='tenno-arsenal-check-v1';
const NAV=[['overview','◈','Overview'],['equipment','⌖','Equipment'],['mods','▦','Mod collection'],['arcanes','◇','Arcanes'],['rivens','✧','Rivens'],['planner','✥','Session planner'],['progress','◉','Progress'],['notes','▤','Notes & trading'],['settings','⚙','Settings']];
const EQUIPMENT_TYPES=['All','Warframes','Primary','Secondary','Melee','Companions','Adversary Weapons','Robotic Weapons','Vehicles','Necramechs','Arch-Guns','Arch-Melees','Amps','Modular'];
const LIVE=[['Warframes','Warframes'],['Primary','Primary'],['Secondary','Secondary'],['Melee','Melee'],['Pets','Companions'],['Sentinels','Companions'],['SentinelWeapons','Robotic Weapons'],['Archwing','Vehicles'],['Arch-Gun','Arch-Guns'],['Arch-Melee','Arch-Melees'],['Mods','Mods'],['Arcanes','Arcanes'],['Misc','Misc']];
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const h=escapeHTML;const enc=encodeURIComponent;const dec=decodeURIComponent;
const bool=v=>v===true;const number=v=>Math.max(0,Number(v)||0);const cleanInt=v=>Math.min(100000,Math.max(0,Math.floor(number(v))));
const fmt=n=>number(n).toLocaleString();
const ek=(cat,name)=>(cat+'|'+name).toLowerCase();
const slug=s=>String(s||'').normalize('NFKD').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const mk=(name,type)=>slug(name)+'|'+slug(type);
const today=()=>new Date().toISOString().slice(0,10);
const state={page:'overview',category:'All',modType:'All',filter:'All',query:'',view:'table',offset:0,limit:80,profile:null,catalogue:{equipment:[],mods:[],arcanes:[]},refresh:null,refreshing:false,editing:null,profileImported:false};
function loadJSON(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch(e){return null}}
function emptyProfile(){return {format:'tenno-arsenal-full-profile',schemaVersion:1,meta:{source:'New empty collection',masteryXP:0,masteryRank:0,masteryToNext:0,inventoryAsOf:'Not imported'},equipment:{},mods:[],arcanes:[],rivens:[],progress:{starChart:{},steelPath:{},intrinsics:{Drifter:'',Railjack:''}},planner:{farmList:[],trades:[],notes:[],bookmarks:[],tasks:[]},videoAudit:null}}
function persist(){if(!state.profile)return;try{localStorage.setItem(PROFILE_KEY,JSON.stringify(state.profile));state.profileImported=true;$('#syncBadge')&&( $('#syncBadge').textContent='Collection saved locally');}catch(e){toast('Browser storage full: export a private backup now',true)}}
function toast(msg,error=false){let t=$('#toast');t.textContent=msg;t.style.borderColor=error?'#c67b72':'#7595b0';t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3800)}
function title(name,description,actions=''){return `<div class="pagehead"><div><div class="eyebrow">YOUR ARSENAL / ${h(state.page.toUpperCase())}</div><h1>${h(name)}</h1>${description?`<p>${h(description)}</p>`:''}</div><div class="actions">${actions}</div></div>`}
function badge(v,kind=''){return `<span class="pill ${kind}">${h(v)}</span>`}
function button(text,action,attrs='',css=''){return `<button class="button ${css}" data-action="${action}" ${attrs}>${text}</button>`}
function option(values,selected){return values.map(v=>`<option value="${h(v)}" ${v===selected?'selected':''}>${h(v)}</option>`).join('')}
function empty(title,detail){return `<div class="empty"><strong>${h(title)}</strong><div>${h(detail||'')}</div></div>`}
function pageButtons(total){return `<div class="pages"><span class="muted tiny">Showing ${fmt(Math.min(total,state.offset+1))}–${fmt(Math.min(total,state.offset+state.limit))} of ${fmt(total)}</span><div class="actions">${button('‹ Previous','prev',state.offset===0?'disabled':'','small')}${button('Next ›','next',state.offset+state.limit>=total?'disabled':'','small')}</div></div>`}
function queryToolbar(extra=''){return `<div class="filters"><input id="searchbox" class="search" autocomplete="off" aria-label="Search items" placeholder="Search names, categories and notes…" value="${h(state.query)}"><select class="select" id="statusFilter" aria-label="Filter status">${option(['All','Owned','Missing','Unmastered','Ready to level','Blueprint/parts','Farming','New items'],state.filter)}</select>${extra}</div>`}
function itemsCatalogue(){return state.catalogue.equipment||[]}
function personalEquipment(r){return state.profile.equipment[ek(r.category,r.name)]||null}
function mergeEquip(){const map=new Map();for(const r of itemsCatalogue())map.set(ek(r.category,r.name),{...r});for(const [k,r] of Object.entries(state.profile.equipment||{}))map.set(k,{...(map.get(k)||{}),...r});return [...map.values()]}
function ownedEquip(r){let p=personalEquipment(r);return !!p?.owned}
function masteredEquip(r){let p=personalEquipment(r);return !!p?.mastered}
function progressEquip(r){let p=personalEquipment(r);return !!p?.blueprint||Object.values(p?.parts||{}).some(Boolean)}
function equipmentFilter(r){const p=personalEquipment(r)||{};const f=state.filter;if(f==='Owned'&&!p.owned)return false;if(f==='Missing'&&p.owned)return false;if(f==='Unmastered'&&p.mastered)return false;if(f==='Ready to level'&&!(p.owned&&!p.mastered))return false;if(f==='Blueprint/parts'&&!progressEquip(r))return false;if(f==='Farming'&&!p.farm)return false;if(f==='New items'&&!r.fromLive)return false;return true}
function allMods(){const map=new Map();for(const m of state.catalogue.mods||[])map.set(m.id||mk(m.name,m.type),{...m,ranks:{}});for(const m of state.profile.mods||[]){const k=m.id||mk(m.name,m.type);const base=map.get(k)||{};map.set(k,{...base,...m,ranks:{...(m.ranks||{})}})}return [...map.values()]}
function modQty(m){return Object.values(m.ranks||{}).reduce((a,b)=>a+number(b),0)}
function allArcanes(){const map=new Map();for(const a of state.catalogue.arcanes||[])map.set(a.name?.toLowerCase(),{...a,rank:0,extra:0});for(const a of state.profile.arcanes||[])map.set(a.name?.toLowerCase(),{...(map.get(a.name?.toLowerCase())||{}),...a});return [...map.values()]}
function filtered(arr,searchFields){const term=state.query.trim().toLowerCase();return !term?arr:arr.filter(item=>searchFields.some(k=>String(item[k]||'').toLowerCase().includes(term)))}
function topNav(){const btns=NAV.map(([id,icon,label])=>`<button data-nav="${id}" class="navItem ${state.page===id?'active':''}"><span class="ni">${icon}</span>${label}</button>`).join('');$('#navigation').innerHTML=btns;$('#mobileNav').innerHTML=NAV.filter(([id])=>['overview','equipment','mods','planner','settings'].includes(id)).map(([id,icon,label])=>`<button data-nav="${id}" class="${state.page===id?'active':''}"><span>${icon}</span>${label==='Mod collection'?'Mods':label==='Session planner'?'Planner':label}</button>`).join('');$('#breadcrumb').textContent='WARFRAME / '+(NAV.find(x=>x[0]===state.page)?.[2]||'OVERVIEW').toUpperCase()}
function statusNotice(){if(state.profileImported)return '';return `<div class="notice warn"><strong>Import your private SpineCrown collection once.</strong> The catalogue is available now, but your owned items, ranks, Arcanes and progress are not in this public website. ${button('Restore my full tracker','import','','gold')}<div class="helptext">Use the private Tenno Arsenal import JSON supplied in our chat. Your records will stay in this browser; they are not uploaded to GitHub.</div></div>`}
function overview(){const equips=mergeEquip(),personal=equips.filter(r=>personalEquipment(r)),mastered=personal.filter(r=>masteredEquip(r)).length,owned=personal.filter(r=>ownedEquip(r)).length,unlevel=personal.filter(r=>ownedEquip(r)&&!masteredEquip(r)),parts=personal.filter(r=>!ownedEquip(r)&&progressEquip(r));const mods=allMods(),ownedMods=mods.filter(m=>modQty(m)>0),arcanes=allArcanes();let content=title('Welcome back, Tenno','Your full Warframe collection, crafting and mastery command centre',(state.profileImported?button('Open session planner','goto','data-target=\"planner\"','gold'):button('Restore collection','import','','gold')));content+=statusNotice();content+=`<div class="cards"><div class="metric"><div class="lbl">Mastery rank · manual</div><div class="val">${fmt(state.profile.meta.masteryRank||0)}</div><div class="note">${fmt(state.profile.meta.masteryXP||0)} recorded XP</div></div><div class="metric"><div class="lbl">Equipment mastered</div><div class="val">${fmt(mastered)} / ${fmt(equips.length)}</div><div class="note">${fmt(owned)} currently owned</div></div><div class="metric"><div class="lbl">Mod collection</div><div class="val">${fmt(ownedMods.length)} / ${fmt(mods.length)}</div><div class="note">${fmt(mods.reduce((s,m)=>s+modQty(m),0))} total copies</div></div><div class="metric"><div class="lbl">Next sessions</div><div class="val">${fmt(unlevel.length+parts.length)}</div><div class="note">${fmt(unlevel.length)} ready to level · ${fmt(parts.length)} part builds</div></div></div>`;
content+=`<div class="cols section"><div class="panel"><div class="editline"><h2>Mastery by equipment category</h2>${button('View all equipment','goto',`data-target="equipment"`,'small')}</div>${EQUIPMENT_TYPES.filter(x=>x!=='All').map(cat=>{const a=equips.filter(r=>r.category===cat),q=a.filter(masteredEquip).length;return a.length?`<div class="listrow"><span>${h(cat)}</span><div class="stats" style="width:53%;"><div style="flex:1"><div class="progressbar"><div style="width:${(q/a.length*100).toFixed(1)}%"></div></div></div><span class="muted tiny" style="min-width:62px;text-align:right">${q} / ${a.length}</span></div></div>`:''}).join('')}</div><div><div class="panel"><h2>Next useful actions</h2>${unlevel.slice(0,5).map(r=>`<div class="listrow"><span>${h(r.name)} <small class="muted">${h(r.category)}</small></span>${badge('Level','gold')}</div>`).join('')||empty('No ready-to-level records','Mark equipment owned but unmastered to see it here.')}${button('Open session planner','goto',`data-target="planner"`,'small')}</div><div class="panel"><h2>Game catalogue status</h2><p id="catalogueStatus">${h(catalogueStatusText())}</p><p class="tiny muted">New equipment is added to the catalogue without resetting your saved progress. Your PlayStation inventory cannot be read automatically.</p>${button('Check now','refresh','','small')}</div></div></div>`;
content+=`<div class="panel"><h2>Coverage & privacy</h2><p>${fmt(equips.length)} equipment entries, ${fmt(mods.length)} mod records and ${fmt(arcanes.length)} Arcanes accessible across the app.</p><p class="muted tiny">Source progress is from the March 2026 Google Sheet; mod quantities include provisional November 2026 video reconciliation. After importing, update gameplay changes in this app. Use Backup to preserve your collection.</p></div>`;
return content}
function equipmentPage(){let rows=mergeEquip().filter(r=>state.category==='All'||r.category===state.category).filter(equipmentFilter);rows=filtered(rows,['name','category','type','description','notes']);rows.sort((a,b)=>a.category.localeCompare(b.category)||a.name.localeCompare(b.name));let s=title('Equipment & mastery','Warframes, weapons, Necramechs, companions, Archwings, modular gear and more',button('Add item','add-equipment','','gold'));s+=statusNotice();s+=queryToolbar(`<select class="select" id="equipmentCategory">${option(EQUIPMENT_TYPES,state.category)}</select>`);s+=`<div class="panel"><div class="editline"><div class="stats">${badge(fmt(rows.length)+' matching entries')} ${badge(fmt(rows.filter(r=>ownedEquip(r)).length)+' owned','ok')} ${badge(fmt(rows.filter(r=>ownedEquip(r)&&!masteredEquip(r)).length)+' ready to level','gold')}</div><span class="muted tiny">Check boxes to change progress instantly. Select an item for blueprints, parts, subsuming and notes.</span></div></div>`;s+='<div class="tablewrap"><table class="data"><thead><tr><th>Item</th><th>Category</th><th class="narrow">Mastered</th><th class="narrow">Owned</th><th class="narrow">Blueprint</th><th>Parts</th><th>Subsumed</th><th>Status</th><th></th></tr></thead><tbody>';
for(const r of rows.slice(state.offset,state.offset+state.limit)){const p=personalEquipment(r)||{},k=enc(ek(r.category,r.name)),parts=p.parts||{},partMax=Object.keys(parts).length;let cls=p.owned?'ok':p.mastered?'gold':'missing';s+=`<tr><td class="name"><a href="#" class="linkname" data-action="edit-equipment" data-key="${k}">${h(r.name)}</a> ${r.fromLive&&!personalEquipment(r)?'<span class="newBadge">NEW</span>':''}</td><td>${h(r.category)}</td><td class="narrow"><input class="check" type="checkbox" data-equipcheck="mastered" data-key="${k}" ${p.mastered?'checked':''}></td><td class="narrow"><input class="check" type="checkbox" data-equipcheck="owned" data-key="${k}" ${p.owned?'checked':''}></td><td class="narrow"><input class="check" type="checkbox" data-equipcheck="blueprint" data-key="${k}" ${p.blueprint?'checked':''}></td><td>${partMax?Object.values(parts).filter(Boolean).length+'/'+partMax:'—'}</td><td>${p.subsumed==null?'—':(p.subsumed?'Yes':'No')}</td><td>${badge(p.owned?'Owned':p.mastered?'Mastered':'Missing',cls)}</td><td>${button('Edit','edit-equipment',`data-key="${k}"`,'small')}</td></tr>`}
s+=`</tbody></table></div>${rows.length?pageButtons(rows.length):empty('No equipment matches','Change your search or filters')}`;return s}
function modPage(){let rows=allMods().filter(m=>state.modType==='All'||m.type===state.modType);const filter=state.filter;rows=rows.filter(m=>{let q=modQty(m);if(filter==='Owned'&&!q)return false;if(filter==='Missing'&&q)return false;if(filter==='Farming'&&!m.farm)return false;if(filter==='New items'&&!m.fromLive)return false;if(filter==='Blueprint/parts'&&!(Object.keys(m.ranks||{}).some(k=>+k>0)))return false;if(filter==='Ready to level'&&!q)return false;return true});rows=filtered(rows,['name','type','rarity','description','subcategory']);rows.sort((a,b)=>a.name.localeCompare(b.name)||a.type?.localeCompare(b.type||'')||0);const types=['All',...new Set(allMods().map(m=>m.type||'Other'))].sort((a,b)=>a==='All'?-1:b==='All'?1:a.localeCompare(b));let s=title('Mod collection','Every duplicate copy and individual upgrade rank, plus missing and farming targets',button('Add mod','add-mod','','gold'));s+=statusNotice();s+=queryToolbar(`<select class="select" id="modTypeFilter">${option(types,state.modType)}</select>`);s+=`<div class="toolbar" style="margin-bottom:13px"><div>${badge(fmt(rows.length)+' entries')}&nbsp;${badge(fmt(rows.filter(m=>modQty(m)).length)+' owned','ok')}</div><div style="margin-left:auto">${button('☷ Table','view',`data-view="table"`,'small '+(state.view==='table'?'on':''))} ${button('▦ Cards','view',`data-view="cards"`,'small '+(state.view==='cards'?'on':''))}</div></div>`;
const slice=rows.slice(state.offset,state.offset+state.limit);if(state.view==='table'){s+='<div class="tablewrap"><table class="data"><thead><tr><th>Mod</th><th>Category</th><th>Rarity</th><th class="narrow">Copies</th><th>Ranks held</th><th>Farming</th><th></th></tr></thead><tbody>';for(const m of slice){const id=enc(m.id||mk(m.name,m.type));const ranks=Object.entries(m.ranks||{}).filter(([,v])=>number(v)>0).map(([r,v])=>`R${r} ×${v}`).join(' · ');s+=`<tr><td class="name"><a href="#" class="linkname" data-action="edit-mod" data-key="${id}">${h(m.name)}</a></td><td>${h(m.type||'—')}</td><td>${h(m.rarity||'—')}</td><td class="narrow">${modQty(m)}</td><td class="muted">${h(ranks||'Missing')}</td><td>${m.farm?badge('Target','gold'):'—'}</td><td>${button('Edit ranks','edit-mod',`data-key="${id}"`,'small')}</td></tr>`}s+='</tbody></table></div>'}else{s+='<div class="modcards">';for(const m of slice){const id=enc(m.id||mk(m.name,m.type)),rarity=(m.rarity||'').toLowerCase();const img=m.imageName&&/^[\w.\-]+$/.test(m.imageName)?`<img loading="lazy" src="https://cdn.warframestat.us/img/${enc(m.imageName)}" alt="">`:'<span class="glyph">◇</span>';s+=`<button class="modcard ${h(rarity)} ${modQty(m)?'':'emptyown'}" data-action="edit-mod" data-key="${id}"><div class="art">${img}</div><div class="modname">${h(m.name)}</div><div class="moddesc">${h(m.description||m.type||'')}</div><div class="modmeta"><span>${h(m.rarity||m.type||'')}</span><strong>${modQty(m)?'×'+modQty(m):'MISSING'}</strong></div></button>`}s+='</div>'}s+=rows.length?pageButtons(rows.length):empty('No mods match','Try clearing the search or filters');return s}
function arcaneNeed(a){if(a.needFromSheet!=null&&Number.isFinite(+a.needFromSheet))return Math.max(0,+a.needFromSheet);const cap=Math.min(10,number(a.maxRank??5)),goal=(cap+1)*(cap+2)/2;const rank=number(a.rank);const have=(rank>0?(rank+1)*(rank+2)/2:0)+number(a.extra);return Math.max(0,Math.round(goal-have))}
function arcanesPage(){let rows=filtered(allArcanes(),['name','collection','rarity','source']).filter(a=>state.filter==='Owned'?(number(a.rank)||number(a.extra)):state.filter==='Missing'?!(number(a.rank)||number(a.extra)):state.filter==='Farming'?a.farm:true);rows.sort((a,b)=>a.name.localeCompare(b.name));let s=title('Arcanes','Track rank, extra copies, acquisition source and copies needed',button('Add Arcane','add-arcane','','gold'));s+=statusNotice();s+=queryToolbar();s+=`<div class="tablewrap"><table class="data"><thead><tr><th>Arcane</th><th>Collection</th><th>Rank</th><th>Extra copies</th><th>Need to max</th><th>Source</th><th></th></tr></thead><tbody>`;for(const a of rows.slice(state.offset,state.offset+state.limit)){s+=`<tr><td class="name">${h(a.name)}</td><td>${h(a.collection)}</td><td>${number(a.rank)} / ${number(a.maxRank??5)}</td><td>${number(a.extra)}</td><td>${arcaneNeed(a)}</td><td class="muted">${h(a.source||'—')}</td><td>${button('Edit','edit-arcane',`data-key="${enc(a.name)}"`,'small')}</td></tr>`}s+=`</tbody></table></div>${rows.length?pageButtons(rows.length):empty('No Arcanes match','Try a different search')}`;return s}

function tasksData(){const equips=mergeEquip(),mods=allMods();const tasks=[];for(const r of equips){const p=personalEquipment(r)||{};if(p.owned&&!p.mastered)tasks.push({id:'level:'+ek(r.category,r.name),name:r.name,group:r.category,action:'Level for mastery',priority:1,detail:'Owned but not mastered'});else if(!p.owned&&progressEquip(r))tasks.push({id:'craft:'+ek(r.category,r.name),name:r.name,group:r.category,action:'Complete the build',priority:2,detail:'Blueprint or components recorded'});if(p.farm)tasks.push({id:'farm:'+ek(r.category,r.name),name:r.name,group:r.category,action:'Farm equipment',priority:3,detail:'Pinned as farming target'})}for(const m of mods)if(m.farm)tasks.push({id:'mod:'+ (m.id||mk(m.name,m.type)),name:m.name,group:m.type||'Mod',action:'Farm mod',priority:3,detail:modQty(m)?'Pinned: additional copies':'Pinned: missing mod'});for(const a of state.profile.arcanes||[])if(a.farm)tasks.push({id:'arc:'+a.name,name:a.name,group:'Arcane',action:'Farm Arcane',priority:3,detail:arcaneNeed(a)+' copies to max'});for(const t of state.profile.planner.tasks||[])tasks.push({...t,priority:t.priority||4,action:t.action||'Personal task',group:t.group||'Custom'});return tasks.sort((a,b)=>a.priority-b.priority||a.name.localeCompare(b.name))}
function plannerPage(){const tasks=filtered(tasksData(),['name','group','action','detail']);let s=title('Your next gaming session','Practical actions based on owned, mastered and partially crafted items',button('Add task','add-task','','gold'));s+=statusNotice();s+=`<div class="cards"><div class="metric"><div class="lbl">Ready to level</div><div class="val">${fmt(tasks.filter(t=>t.priority===1).length)}</div></div><div class="metric"><div class="lbl">Finish crafting</div><div class="val">${fmt(tasks.filter(t=>t.priority===2).length)}</div></div><div class="metric"><div class="lbl">Farming targets</div><div class="val">${fmt(tasks.filter(t=>t.priority===3).length)}</div></div><div class="metric"><div class="lbl">All actions</div><div class="val">${fmt(tasks.length)}</div></div></div>`;s+=`<div class="section">${queryToolbar()}</div><div class="panel"><h2>Session priorities</h2>${tasks.slice(state.offset,state.offset+state.limit).map(t=>`<div class="task"><span class="pill ${t.priority===1?'ok':t.priority===2?'gold':''}">${t.priority}</span><div><div class="taskname">${h(t.name)}</div><div class="tasksublabel">${h(t.action)} · ${h(t.group)} · ${h(t.detail||'')}</div></div>${t.id?.startsWith('custom:')?button('Done','remove-task',`data-key="${enc(t.id)}"`,'small'):button('Open','open-task',`data-key="${enc(t.id)}"`,'small')}</div>`).join('')||empty('No actions match','Own an unmastered item or mark an item for farming to create a task automatically.')}</div>${tasks.length?pageButtons(tasks.length):''}`;if((state.profile.planner.farmList||[]).length)s+=`<div class="panel"><h2>Imported farm list</h2>${state.profile.planner.farmList.map(t=>`<div class="listrow"><span>${h(t.name)}</span>${badge(t.category||'Farm','gold')}</div>`).join('')}</div>`;return s}
function progressPage(){const p=state.profile.progress||{starChart:{},steelPath:{},intrinsics:{}};let names=[...new Set([...Object.keys(p.starChart||{}),...Object.keys(p.steelPath||{})])];let s=title('Star chart & intrinsics','Normal star chart, Steel Path and mastery rank information');s+=statusNotice();s+=`<div class="grid2"><div class="panel"><h2>Mastery rank & XP</h2><div class="formgrid"><label>Mastery rank<input class="field" type="number" min="0" id="masteryRank" value="${number(state.profile.meta.masteryRank)}"></label><label>Total mastery XP<input class="field" type="number" min="0" id="masteryXP" value="${number(state.profile.meta.masteryXP)}"></label><label>XP remaining to next rank (manual)<input class="field" type="number" min="0" id="masteryNext" value="${number(state.profile.meta.masteryToNext)}"></label></div><p class="helptext">This information cannot be kept in sync with PlayStation automatically. Update your mastery figures when you rank up.</p>${button('Save mastery','save-mastery','','gold')}</div><div class="panel"><h2>Intrinsics</h2><div class="formgrid"><label>Drifter total recorded<input class="field" id="drifterIntrinsic" value="${h(p.intrinsics?.Drifter||'')}"></label><label>Railjack total recorded<input class="field" id="railjackIntrinsic" value="${h(p.intrinsics?.Railjack||'')}"></label></div><p class="helptext">Preserved from your workbook; treat these as recorded values rather than live game totals.</p>${button('Save intrinsics','save-intrinsics','','gold')}</div></div>`;

function settingsPage(){let p=state.profile;let s=title('Settings & data safety','One app address, public game content, private player progress');s+=`<div class="grid2"><div class="panel"><h2>Your private profile</h2><p><strong>${state.profileImported?'Collection loaded':'No private collection imported yet'}</strong></p><p class="muted tiny">${h(p.meta?.source||'')}</p><p class="muted tiny">${h(p.meta?.inventoryAsOf||'')}</p><div class="toolbar">${button('Import full tracker','import','','gold')}${button('Backup collection','backup')}</div><p class="helptext">Import only a file you trust. The file is read locally and isn't sent to GitHub or the community data provider. Browser storage is device-specific; back up to OneDrive or another private location.</p></div><div class="panel"><h2>Current Warframe catalogue</h2><p>${h(catalogueStatusText())}</p><p>Public data source: <a href="https://github.com/WFCD/warframe-items" target="_blank" rel="noopener noreferrer">WFCD / warframe-items</a>.</p>${button('Check for the latest content','refresh','','gold')}<p class="helptext">The app checks approximately every 24 hours while online and adds new public item records. It never overwrites your personal owned/mastered/rank values. Community data may lag a patch; check the date shown here.</p></div></div><div class="panel"><h2>What's included</h2><p>All workbook categories: equipment mastery, ownership, blueprints and parts, Helminth subsuming, mods and ranks, Arcanes, Rivens, star chart, Steel Path, intrinsics, farming, trading and notes. Workbook Search and MasterList are replaced by live search and filtered views.</p><p class="muted tiny">No PlayStation inventory API, no auto-import from the mobile Companion app, no cross-device cloud sync yet. Your November video inventory contains readings that still need review.</p><hr class="line"><p>${button('Export a private backup','backup','','gold')} ${button('Restore a private backup','import')}</p></div>`;return s}

function findEquipment(k){return mergeEquip().find(r=>ek(r.category,r.name)===k)}

function findMod(k){return allMods().find(m=>(m.id||mk(m.name,m.type))===k)}

function modEditor(k){const m=findMod(k);if(!m)return;const max=Math.max(0,Math.min(10,Number.isFinite(+m.maxRank)?+m.maxRank:10));let ranks='';for(let i=0;i<=max;i++)ranks+=`<label>Rank ${i}<input class="field" type="number" min="0" max="99999" step="1" data-rank="${i}" value="${cleanInt(m.ranks?.[i]||0)}"></label>`;openEditor(m.name,`<p class="muted tiny">${h(m.type||'Mod')} · ${h(m.rarity||'')} · ${h(m.description||'')}</p><p>${badge(modQty(m)+' copies','ok')} ${m.videoVerified?badge('Video-verified','gold'):''}</p><h3>Copies by upgrade rank</h3><div class="rankgrid">${ranks}</div><p class="helptext">Maximum-rank information comes from the public catalogue when available; otherwise the editor permits up to rank 10. Only enter ranks that exist for this mod.</p><div class="formgrid"><label class="checkboxlabel">Farming target <input class="check" id="mFarm" type="checkbox" ${m.farm?'checked':''}></label><label class="wide">Notes<textarea id="mNotes">${h(m.notes||'')}</textarea></label></div>`,'mod',k)}

function saveEditor(){const e=state.editing;if(!e)return false;const v=id=>$('#'+id)?.value||'',ch=id=>!!$('#'+id)?.checked;const p=state.profile;if(e.kind==='equipment'){const r=ensureEquipment(e.key);if(!r)return false;r.mastered=ch('eMastered');r.owned=ch('eOwned');r.blueprint=ch('eBP');r.farm=ch('eFarm');r.notes=v('eNotes');const sub=$('#eSub');if(sub)r.subsumed=sub.value==='Not applicable'?null:sub.value==='Yes';r.parts={};$$('#partGrid [data-part]').forEach(x=>r.parts[x.dataset.part]=x.checked)}else if(e.kind==='mod'){const m=ensureMod(e.key);if(!m)return false;m.ranks={};$$('#editorbody [data-rank]').forEach(x=>{const n=cleanInt(x.value);if(n)m.ranks[x.dataset.rank]=n});m.farm=ch('mFarm');m.notes=v('mNotes')}else if(e.kind==='arcane'){const a=ensureArcane(e.key);if(!a)return false;a.rank=Math.min(number(a.maxRank||5),cleanInt(v('aRank')));a.extra=cleanInt(v('aExtra'));a.farm=ch('aFarm');a.notes=v('aNotes');delete a.needFromSheet}else if(e.kind==='riven'){const r={weapon:v('rWeapon').trim(),name:v('rName').trim(),decision:v('rDecision'),positive:v('rPositive').split(',').map(x=>x.trim()).filter(Boolean),negative:v('rNegative'),rolls:cleanInt(v('rRolls')),notes:v('rNotes')};if(!r.weapon){toast('Enter the Riven weapon first',true);return false}if(e.key<0)p.rivens.push(r);else p.rivens[e.key]=r}else if(e.kind==='note'){let a={title:v('nTitle'),body:v('nBody')};if(e.key<0)p.planner.notes.push(a);else p.planner.notes[e.key]=a}else if(e.kind==='trade'){let a={part:v('tPart'),friend:v('tFriend'),notes:v('tNotes')};if(e.key<0)p.planner.trades.push(a);else p.planner.trades[e.key]=a}else if(e.kind==='task'){if(!v('taskName').trim()){toast('Add a task name',true);return false}p.planner.tasks.push({id:'custom:'+Date.now(),name:v('taskName').trim(),detail:v('taskDetail'),group:'Custom',action:'Personal task',priority:4})}else if(e.kind==='add-equipment'){const name=v('newEquipName').trim(),cat=v('newEquipCategory');if(!name)return false;ensureCatalogueEquip({name,category: function backup(){fileDownload('Tenno_Arsenal_Private_Backup_'+today()+'.json',{...state.profile,exportedAt:new Date().toISOString()});toast('Private backup downloaded. Save it in OneDrive.')}
function importProfile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const j=JSON.parse(reader.result);let p;if(j.format==='tenno-arsenal-full-profile'&&j.equipment&&j.mods){p=j}else if(j.backup?.mods){p=emptyProfile();p.mods=j.backup.mods;p.videoAudit=j.audit||null;p.meta.inventoryAsOf='Mod-only backup; equipment not included';toast('Imported mod-only backup. Equipment remains empty.')}else{throw Error('Not a Tenno Arsenal profile JSON')}if(!Array.isArray(p.mods)||!p.equipment||typeof p.equipment!=='object')throw Error('Invalid profile structure');state.profile=p;state.profileImported=true;persist();go('overview');toast('Full collection restored privately — '+fmt(Object.keys(p.equipment).length)+' equipment records')}catch(err){toast('Import failed: '+err.message,true)}};reader.readAsText(file)}
function liveShape(item,cat){if(!item||typeof item.name!=='string'||!item.name.trim())return null;const c={name:item.name.trim(),category:cat,fromLive:true,type:item.type||'',imageName:item.imageName||'',uniqueName:item.uniqueName||'',rarity:item.rarity||'',description:item.description||'',maxRank:Number.isFinite(+item.maxRank)?+item.maxRank:undefined};if(item.components&&Array.isArray(item.components))c.components=item.components.slice(0,20).map(x=>({name:x.name||x.component||'',itemCount:x.itemCount||x.count||1}));if(item.drops&&Array.isArray(item.drops))c.drops=item.drops.slice(0,7).map(d=>({location:d.location||d.place||'',chance:d.chance||0}));return c}
function mergeCatalogue(base,cat,items){let count=0;if(cat==='Misc'){const nm=items.filter(x=>/necramech/i.test(String(x.type||x.category||'')));return mergeCatalogue(base,'Necramechs',nm)}if(cat==='Mods'){const map=new Map(base.mods.map((m,i)=>[m.id||mk(m.name,m.type),i]));for(const obj of items){const x=liveShape(obj,cat);if(!x)continue;x.type=obj.type||obj.category||'Other';const id=mk(x.name,x.type);x.id=id;if(map.has(id)){base.mods[map.get(id)]={...base.mods[map.get(id)],...x,id}}else{base.mods.push(x);map.set(id,base.mods.length-1);count++}}}else if(cat==='Arcanes'){const map=new Map(base.arcanes.map((x,i)=>[x.name.toLowerCase(),i]));for(const obj of items){const x=liveShape(obj,cat);if(!x)continue;const k=x.name.toLowerCase();if(map.has(k))base.arcanes[map.get(k)]={...base.arcanes[map.get(k)],...x};else{base.arcanes.push(x);map.set(k,base.arcanes.length-1);count++}}}else{const map=new Map(base.equipment.map((x,i)=>[ek(x.category,x.name),i]));for(const obj of items){const x=liveShape(obj,cat);if(!x)continue;const k=ek(x.category,x.name);if(['Primary','Secondary','Melee'].includes(cat)&&map.has(ek('Adversary Weapons',x.name)))continue;if(map.has(k))base.equipment[map.get(k)]={...base.equipment[map.get(k)],...x};else{base.equipment.push(x);map.set(k,base.equipment.length-1);count++}}}return count}
async function getLive(category){const path=enc(category)+'.json';const urls=[`https://raw.githubusercontent.com/WFCD/warframe-items/master/data/json/${path}`,`https://cdn.jsdelivr.net/gh/WFCD/warframe-items@master/data/json/${path}`];for(const url of urls){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),22000);try{const response=await fetch(url,{signal:ctrl.signal,cache:'no-cache'});if(!response.ok)throw Error(String(response.status));const data=await response.json();if(Array.isArray(data)&&data.length)return data}catch(err){}finally{clearTimeout(timer)}}throw Error('Category unavailable: '+category)}
async function refreshCatalog(manual=false){if(state.refreshing)return;state.refreshing=true;render();let newItems=0,loaded=0,failed=[];const base=JSON.parse(JSON.stringify(state.catalogue));const work=[...LIVE];async function worker(){while(work.length){const [source,cat]=work.shift();try{const data=await getLive(source);if(data?.length){loaded+=data.length;newItems+=mergeCatalogue(base,cat,data)}}catch(e){failed.push(source)}}}await Promise.all([worker(),worker(),worker()]);const ok=loaded>0;state.refresh={at:new Date().toISOString(),ok,items:loaded,newItems,failed};state.refreshing=false;if(ok){state.catalogue=base;try{localStorage.setItem(CAT_KEY,JSON.stringify(base))}catch(e){console.warn('Catalogue cache full',e)}}try{localStorage.setItem(CHECK_KEY,JSON.stringify(state.refresh))}catch(e){}render();if(manual)toast(ok?`Checked ${fmt(loaded)} items. ${fmt(newItems)} new entries added.${failed.length?' Some categories unavailable.':''}`:'Live update unavailable. Using saved catalogue.',!ok)}
async function init(){state.profile=loadJSON(PROFILE_KEY)||emptyProfile();state.profileImported=!!loadJSON(PROFILE_KEY);try{const embedded=document.getElementById('catalogue-seed');const seed=embedded?JSON.parse(embedded.textContent):await (await fetch('./catalogue.json',{cache:'no-store'})).json();state.catalogue={equipment:seed.equipment||[],mods:seed.mods||[],arcanes:seed.arcanes||[]}}catch(e){state.catalogue={equipment:[],mods:[],arcanes:[]};toast('Base catalogue unavailable. Check internet / hosting.',true)}const cached=loadJSON(CAT_KEY);if(cached?.equipment?.length){state.catalogue={equipment:cached.equipment||[],mods:cached.mods||[],arcanes:cached.arcanes||[]}}state.refresh=loadJSON(CHECK_KEY);render();const age=state.refresh?.at?Date.now()-new Date(state.refresh.at).getTime():Infinity;if(age>24*60*60*1000)refreshCatalog(false);if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}}

document.addEventListener('click',ev=>{const nav=ev.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return}const b=ev.target.closest('[data-action]');if(!b)return;ev.preventDefault();const a=b.dataset.action,k=b.dataset.key?dec(b.dataset.key):'',field=b.dataset.field;switch(a){case 'goto':go(b.dataset.target);break;case 'view':state.view=b.dataset.view;render();break;case 'next':state.offset+=state.limit;render();break;case 'prev':state.offset=Math.max(0,state.offset-state.limit);render();break;case 'import':$('#profileFile').click();break;case 'backup':backup();break;case 'refresh':refreshCatalog(true);break;case 'edit-equipment':equipEditor(k);break;case 'edit-mod':modEditor(k);break;case 'edit-arcane':arcaneEditor(k);break;case 'edit-riven':rivenEditor(+k);break;case 'edit-note':noteEditor(+k);break;case 'edit-trade':tradeEditor(+k);break;case 'add-equipment':addEquipmentEditor();break;case 'add-mod':addModEditor();break;case 'add-arcane':addArcaneEditor();break;case 'add-riven':rivenEditor(-1);break;case 'add-note':noteEditor(-1);break;case 'add-trade':tradeEditor(-1);break;case 'add-task':taskEditor();break;case 'remove-task':state.profile.planner.tasks=state.profile.planner.tasks.filter(x=>x.id!==k);persist();render();break;case 'open-task':{const parts=k.split(':');if(parts[0]==='level'||parts[0]==='craft'||parts[0]==='farm')equipEditor(k.slice(parts[0].length+1));else if(parts[0]==='mod')modEditor(k.slice(4));else if(parts[0]==='arc')arcaneEditor(k.slice(4));break}case 'add-part':{const name=$('#newPart')?.value.trim();if(!name)return;const grid=$('#partGrid');if(grid.querySelector('.helptext,.muted'))grid.querySelector('.muted')?.remove();if(![...grid.querySelectorAll('[data-part]')].some(x=>x.dataset.part===name)){const label=document.createElement('label');label.className='checkboxlabel';const cb=document.createElement('input');cb.type='checkbox';cb.className='check';cb.dataset.part=name;cb.checked=true;label.append(cb,document.createTextNode(name));grid.append(label)}$('#newPart').value='';break}case 'save-mastery':state.profile.meta.masteryRank=cleanInt($('#masteryRank').value);state.profile.meta.masteryXP=cleanInt($('#masteryXP').value);state.profile.meta.masteryToNext=cleanInt($('#masteryNext').value);persist();render();toast('Mastery saved');break;case 'save-intrinsics':state.profile.progress.intrinsics={Drifter:$('#drifterIntrinsic').value,Railjack:$('#railjackIntrinsic').value};persist();toast('Intrinsics saved');break;case 'add-planet':{let name=$('#addPlanet-'+field)?.value.trim();if(!name)return;state.profile.progress[field][name]=false;persist();render();break}case 'delete-riven':state.profile.rivens.splice(+k,1);persist();$('#editor').close();render();toast('Riven deleted');break;}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='equipmentCategory'){state.category=t.value;state.offset=0;render()}else if(t.id==='modTypeFilter'){state.modType=t.value;state.offset=0;render()}else if(t.id==='statusFilter'){state.filter=t.value;state.offset=0;render()}else if(t.dataset.equipcheck){let k=dec(t.dataset.key);let p=ensureEquipment(k);if(p){p[t.dataset.equipcheck]=t.checked;persist();render()}}else if(t.dataset.progress){let name=dec(t.dataset.name);state.profile.progress[t.dataset.progress][name]=t.checked;persist();render()}});
document.addEventListener('input',ev=>{if(ev.target.id!=='searchbox')return;const input=ev.target,caret=input.selectionStart;state.query=input.value;state.offset=0;render();const fresh=$('#searchbox');if(fresh){fresh.focus();try{fresh.setSelectionRange(caret,caret)}catch(e){}}});
$('#saveEdit').addEventListener('click',e=>{if(!saveEditor())e.preventDefault()});
$('#profileFile').addEventListener('change',e=>{importProfile(e.target.files?.[0]);e.target.value=''});
$('#backupNow').addEventListener('click',backup);$('#refreshCatalogue').addEventListener('click',()=>refreshCatalog(true));
init();

</script>
